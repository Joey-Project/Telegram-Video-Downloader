name: Rust CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Ensure native music codec dependencies and test tools
        run: |
          if ! command -v flac >/dev/null || ! command -v pkg-config >/dev/null; then
            brew install flac pkg-config
          fi
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi

      - name: Run workspace Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run all Rust tests, including native codec and mock Telegram E2E
        run: cargo test --locked --workspace --all-targets --quiet

      - name: Test converter client without native dependencies
        run: cargo test --locked -p flac-alac-converter --no-default-features --lib --quiet

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Check macOS service shell syntax
        run: |
          bash -n scripts/launch_agent.sh
          bash -n scripts/test_launch_agent.sh

      - name: Install pinned Music protocol test dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --no-binary=pyaes
          --requirement scripts/music-requirements.txt

      - name: Test macOS service helpers
        run: |
          python3 scripts/test_macos_service.py
          python3 scripts/test_music_test_runtime.py
          python3 scripts/test_music_transfer.py
          python3 scripts/test_music_runtime_installer.py
          bash scripts/test_launch_agent.sh

      - name: Validate fixed Music test runtime metadata
        run: |
          cargo build --features test-runtime
          python3 scripts/music_test_runtime.py plan --binary target/debug/telegram-video-downloader
          cargo test --features test-runtime music_ --quiet
