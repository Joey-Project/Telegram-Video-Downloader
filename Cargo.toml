[package]
name = "telegram-video-downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bbdown-core = { git = "https://github.com/Joey-Project/BBDown-rust", rev = "0a94b071bbc1897ec1d1fec9dfcf7883c5754a15", package = "bbdown-core" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2"
qrcode = "0.14.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
futures-util = "=0.3.32"
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["block2", "NSError", "NSFileCoordinator", "NSURL", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
