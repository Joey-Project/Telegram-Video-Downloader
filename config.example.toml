[telegram]
token = "123456789:replace-with-your-token"
allowed_chat_ids = [123456789]
allow_all_chats = false

[downloads]
video_dir = "~/Movies/Downloads"
pdf_dir = "~/Documents/Downloads"

[tools]
# Bilibili downloads/auth use the embedded bbdown-core crate; bbdown is kept for legacy helpers only.
bbdown = "bbdown"
yt_dlp = "yt-dlp"
gallery_dl = "gallery-dl" # Used for Instagram posts, stories and profile photos.
# Optional Python with gallery-dl installed. On macOS the uv tool runtime is detected if present.
# instagram_session_python = "~/.local/share/uv/tools/gallery-dl/bin/python"
uv = "uv"
pdf_helper = "scripts/pdf_helper.py"
chrome = "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
ffmpeg = "ffmpeg"

[pdf]
auto_domains = ["mp.weixin.qq.com"]

[video]
subtitle_languages = ["zh-Hans", "zh-Hant", "zh", "zh-CN", "zh-TW", "en", "ja"]
write_nfo = true
keep_sidecars = true

# Automatic Apple Music imports are supported on macOS. `enabled` defaults to
# true on macOS and false on other targets; leave it disabled elsewhere.
[music]
max_file_bytes = 536870912 # 512 MiB
cloud_poll_seconds = 60
# FLAC and supported PCM WAV are converted losslessly by the native helper.
# converter defaults to the active profile's libexec/flac-alac-converter.
conversion_timeout_seconds = 1800
# Defaults are rooted at the configured video download root. With the default
# downloads.video_dir above, they resolve to these hidden directories:
# state_dir = "~/Movies/Downloads/.telegram-video-downloader-music"
# staging_dir = "~/Movies/Downloads/.telegram-video-downloader-staging/music"
archive_dir = "~/Library/Mobile Documents/com~apple~CloudDocs/Collection/Music"

# Optional .torrent uploads use an existing local qBittorrent WebUI API.
# Download every file; choose audio for Music separately with the task's buttons.
# Existing qBittorrent tasks keep their paths, categories and seeding files.
# New magnets use a task folder below qBittorrent's default download directory.
[torrent]
enabled = false
base_url = "http://127.0.0.1:8080"
# Leave credentials unset when the existing service permits localhost clients.
# Otherwise use the private config file; never publish WebUI credentials.
# username = ""
# password = ""
# state_dir defaults to <video root>/.telegram-video-downloader-torrents.
# Optional read-only fallback for magnets with qBittorrent older than 4.5:
# metainfo_dir = "~/Library/Application Support/qBittorrent/BT_backup"
max_torrent_bytes = 4194304 # 4 MiB of metainfo, not the payload size
max_files = 5000
poll_seconds = 10
request_timeout_seconds = 10
max_api_response_bytes = 2097152 # Increase for unusually large file lists; max 16 MiB

[bilibili]
# Legacy CLI fields accept only mapped bbdown-core options. Unsupported values, non-empty
# plan_args, and a BBDown.config file in video_dir fail startup instead of being ignored.
# Direct bbdown-core integration reads supported global flags from extra_args, with global_args
# and the structured fields below taking precedence for single values.
extra_args = []
global_args = []
plan_args = []
download_args = []
# playurl_mode = "web" # web | tv | app
# restricted_area = "cn" # cn | th | hk | tw
restricted_area_proxies = []
restricted_api_proxies = []
danmaku_formats = ["xml", "ass"]

[bilibili.danmaku]
enabled = true
# These settings affect generated ASS danmaku only. XML sidecars stay unchanged.
font_scale = 3.0
opacity = 0.7
display_area = 0.5
# Group identical nearby scrolling comments in generated ASS (0 disables grouping).
merge_window_ms = 1500

[bilibili.auth]
# Legacy bot-managed Web cookie state; BBDown-rust credentials live in credential_file.
state_path = "~/.local/state/telegram-video-downloader/bilibili-auth.json"
credential_file = "~/.local/state/telegram-video-downloader/bbdown-credentials.json"
# The direct parent of credential_file must not be a symbolic link.
# credential_profile = "default"
login_timeout_seconds = 180
poll_interval_seconds = 2

[bot]
concurrency = 2
poll_timeout_seconds = 50
progress_update_seconds = 5
command_timeout_seconds = 7200
command_idle_timeout_seconds = 300

# Optional cloud ingress. Enable after the Worker and D1 are configured.
# Keep the shared secret in private config or the environment variable below.
# TELEGRAM_VIDEO_DOWNLOADER_CLOUD_SHARED_SECRET overrides shared_secret.
# [cloud]
# worker_url = "https://your-worker.your-subdomain.workers.dev"
# shared_secret = ""
# Legacy setting retained for compatibility; effective idle reconciliation is hourly.
# fallback_poll_seconds = 3600
